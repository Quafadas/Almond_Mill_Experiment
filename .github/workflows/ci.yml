name: CI

on:
  push:
    branches: [main]
    # Without this, a `git push --tags` matches no trigger at all: a push event
    # carrying a `branches` filter and no `tags` filter ignores tag pushes.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to a branch supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: scala-notebook-shadow

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: scala-notebook-shadow/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: tsc --noEmit
        run: npm run typecheck

  test:
    name: Test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: scala-notebook-shadow/package-lock.json

      - run: npm ci

      # `pretest` compiles, so this also proves the TypeScript build.
      - name: Unit tests
        run: npm test

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: scala-notebook-shadow/package-lock.json

      - run: npm ci

      - run: npm run compile

      # On a tag build, refuse to package a VSIX whose version disagrees with the tag.
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # --no-dependencies: nothing ships at runtime, the extension is plain compiled JS.
      # vsce names the file <name>-<version>.vsix.
      - name: vsce package
        run: npx --yes @vscode/vsce@^3 package --no-dependencies

      - uses: actions/upload-artifact@v7
        with:
          name: scala-notebook-shadow-vsix
          path: scala-notebook-shadow/*.vsix
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: scala-notebook-shadow-vsix
          path: dist

      # `gh` and GITHUB_TOKEN are already on the runner, so no third-party action.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.vsix \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
        working-directory: ${{ github.workspace }}
