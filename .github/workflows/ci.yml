name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch supersedes the run already in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: scala-notebook-shadow

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: scala-notebook-shadow/package-lock.json

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: tsc --noEmit
        run: npm run typecheck

  test:
    name: Test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: scala-notebook-shadow/package-lock.json

      - run: npm ci

      # `pretest` compiles, so this also proves the TypeScript build.
      - name: Unit tests
        run: npm test

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: scala-notebook-shadow/package-lock.json

      - run: npm ci

      - run: npm run compile

      # --no-dependencies: nothing ships at runtime, the extension is plain compiled JS.
      - name: vsce package
        run: npx --yes @vscode/vsce@^3 package --no-dependencies --out scala-notebook-shadow.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: scala-notebook-shadow-vsix
          path: scala-notebook-shadow/scala-notebook-shadow.vsix
          if-no-files-found: error
