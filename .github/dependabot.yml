version: 2
updates:
  - package-ecosystem: npm
    directory: /scala-notebook-shadow
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint's peer range caps TypeScript at <6.1.0, and TypeScript
      # 6 itself cannot resolve @types/node. Unpin once typescript-eslint
      # supports TypeScript 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
